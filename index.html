      const FIREBASE_CONFIG = {
        apiKey: "",
        authDomain: "",
        databaseURL: "https://lovequest-bc1c2-default-rtdb.firebaseio.com/",
        projectId: "",
        storageBucket: "",
        messagingSenderId: "",
        appId: ""
      };

      const DAY_MS = 24 * 60 * 60 * 1000;
      const WEEK_MS = 7 * DAY_MS;
      const MAX_SWAPS_PER_DAY = 2;
      const TENGE_PER_COIN = 100; // 100 монет = 10 000 ₸
      const STORAGE_TIMEOUT_MS = 1500;
      const NETWORK_TIMEOUT_MS = 7000;
<!-- ... existing code ... -->
      /* ========================================================================
         6. LEVEL 2 PERSISTENCE: TRIPLE-LAYER SESSION STORE
            (Telegram CloudStorage + localStorage + IndexedDB)
            + Local Snapshot Cache (prevents unpairing on offline reopen)
         ======================================================================== */
      const SESSION_KEY = 'lovequest_couple_session_v2';
      const SNAPSHOT_KEY = 'lovequest_last_snapshot_v2';
      const IDB_NAME = 'lovequest_couple_idb';
      const IDB_STORE = 'kv';

      function withTimeout(promise, ms, fallbackVal = null) {
        return new Promise((resolve) => {
          let settled = false;
          const timer = setTimeout(() => {
            if (!settled) {
              settled = true;
              resolve(fallbackVal);
            }
          }, ms);
          Promise.resolve(promise)
            .then(val => {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(val);
              }
            })
            .catch(() => {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(fallbackVal);
              }
            });
        });
      }

      const SessionStore = {
        memorySession: null,

        openIDB() {
          return new Promise((resolve, reject) => {
            try {
              const req = indexedDB.open(IDB_NAME, 1);
              req.onupgradeneeded = () => {
                if (!req.result.objectStoreNames.contains(IDB_STORE)) {
                  req.result.createObjectStore(IDB_STORE);
                }
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => reject(req.error);
            } catch (e) { reject(e); }
          });
        },

        async idbSet(key, val) {
          try {
            const db = await withTimeout(this.openIDB(), STORAGE_TIMEOUT_MS, null);
            if (!db) return;
            await withTimeout(new Promise((res, rej) => {
              const tx = db.transaction(IDB_STORE, 'readwrite');
              tx.objectStore(IDB_STORE).put(val, key);
              tx.oncomplete = res;
              tx.onerror = rej;
            }), STORAGE_TIMEOUT_MS, null);
          } catch (_) {}
        },

        async idbGet(key) {
          try {
            const db = await withTimeout(this.openIDB(), STORAGE_TIMEOUT_MS, null);
            if (!db) return null;
            return await withTimeout(new Promise((res) => {
              const tx = db.transaction(IDB_STORE, 'readonly');
              const req = tx.objectStore(IDB_STORE).get(key);
              req.onsuccess = () => res(req.result || null);
              req.onerror = () => res(null);
            }), STORAGE_TIMEOUT_MS, null);
          } catch (_) { return null; }
        },

        tgCloudGet(key) {
          return withTimeout(new Promise((resolve) => {
            try {
              if (tg?.CloudStorage?.getItem) {
                tg.CloudStorage.getItem(key, (err, value) => {
                  if (!err && value) {
                    try { resolve(JSON.parse(value)); return; } catch (_) {}
                  }
                  resolve(null);
                });
              } else {
                resolve(null);
              }
            } catch (_) { resolve(null); }
          }), STORAGE_TIMEOUT_MS, null);
        },

        tgCloudSet(key, obj) {
          try {
            if (tg?.CloudStorage?.setItem) {
              tg.CloudStorage.setItem(key, JSON.stringify(obj), () => {});
            }
          } catch (_) {}
        },

        async load() {
          let localData = null;
          try {
            const raw = localStorage.getItem(SESSION_KEY);
            if (raw) localData = JSON.parse(raw);
          } catch (_) {}

          // Параллельно опрашиваем Telegram CloudStorage и IndexedDB с защитой по таймауту
          const [cloudData, idbData] = await Promise.all([
            this.tgCloudGet(SESSION_KEY),
            this.idbGet(SESSION_KEY)
          ]);

          // Выбираем самую свежую сохранённую сессию с активным pairCode
          const candidates = [localData, cloudData, idbData].filter(Boolean);
          candidates.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

          const merged = Object.assign({}, ...candidates.slice().reverse());
          const withPair = candidates.find(c => c.pairCode && c.role);
          if (withPair && (!merged.pairCode || !merged.role)) {
            merged.pairCode = withPair.pairCode;
            merged.role = withPair.role;
          }

          this.memorySession = merged;

          // Синхронизируем обратно во все 3 хранилища, чтобы не было рассинхрона
          if (merged.pairCode && merged.role) {
            try { localStorage.setItem(SESSION_KEY, JSON.stringify(merged)); } catch (_) {}
            this.tgCloudSet(SESSION_KEY, merged);
            this.idbSet(SESSION_KEY, merged);
          }
          return merged;
        },

        async save(sessionObj) {
          const payload = { ...(this.memorySession || {}), ...sessionObj, updatedAt: Date.now() };
          this.memorySession = payload;
          try { localStorage.setItem(SESSION_KEY, JSON.stringify(payload)); } catch (_) {}
          this.tgCloudSet(SESSION_KEY, payload);
          await this.idbSet(SESSION_KEY, payload);
        },

        async saveAudioPrefs(audioPrefs) {
          await this.save({ audioPrefs });
        },

        saveSnapshot(pairCode, pairData) {
          if (!pairCode || !pairData) return;
          const pack = { pairCode, data: pairData, savedAt: Date.now() };
          try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(pack)); } catch (_) {}
          this.idbSet(SNAPSHOT_KEY, pack);
        },

        async loadSnapshot(pairCode) {
          try {
            const raw = localStorage.getItem(SNAPSHOT_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && parsed.pairCode === pairCode && parsed.data) return parsed.data;
            }
          } catch (_) {}
          const idbPack = await this.idbGet(SNAPSHOT_KEY);
          if (idbPack && idbPack.pairCode === pairCode && idbPack.data) return idbPack.data;
          return null;
        },

        async clearPair() {
          const cleaned = {
            audioPrefs: (this.memorySession && this.memorySession.audioPrefs) || AudioEngine.prefs,
            updatedAt: Date.now()
          };
          this.memorySession = cleaned;
          try {
            localStorage.setItem(SESSION_KEY, JSON.stringify(cleaned));
            localStorage.removeItem(SNAPSHOT_KEY);
          } catch (_) {}
          this.tgCloudSet(SESSION_KEY, cleaned);
          await this.idbSet(SESSION_KEY, cleaned);
          await this.idbSet(SNAPSHOT_KEY, null);
        }
      };

      /* ========================================================================
         7. LEVEL 1 REALTIME DATABASE ENGINE (FIREBASE + LOCAL DEMO FALLBACK)
            + Data Normalization (handles Firebase stripping empty arrays/objects)
         ======================================================================== */
      function toArray(val) {
        if (Array.isArray(val)) return val.filter(Boolean);
        if (val && typeof val === 'object') return Object.values(val).filter(Boolean);
        return [];
      }

      function normalizePairData(raw, fallbackCode = '') {
        if (!raw || typeof raw !== 'object') return null;
        const now = Date.now();
        const meta = raw.meta || {};
        const daily = raw.daily || {};
        const wallet = raw.wallet || {};
        const shop = raw.shop || {};

        let quests = toArray(daily.quests);
        if (!quests.length) {
          const fresh = generateDailyCycle(toArray(daily.usedQuestIds));
          quests = fresh.quests;
        }

        return {
          meta: {
            pairCode: meta.pairCode || fallbackCode,
            createdAt: meta.createdAt || now,
            boyfriendTgUrl: meta.boyfriendTgUrl || '',
            boyfriendName: meta.boyfriendName || 'Парень',
            girlfriendName: meta.girlfriendName || 'Девушка',
            boyfriendJoined: Boolean(meta.boyfriendJoined),
            girlfriendJoined: Boolean(meta.girlfriendJoined),
            boyfriendLastSeen: meta.boyfriendLastSeen || 0,
            girlfriendLastSeen: meta.girlfriendLastSeen || 0
          },
          daily: {
            cycleId: daily.cycleId || `cycle_${now}`,
            cycleStartTs: daily.cycleStartTs || now,
            nextResetTs: daily.nextResetTs || (now + DAY_MS),
            quests,
            replacementsUsed: Number(daily.replacementsUsed || 0),
            usedQuestIds: toArray(daily.usedQuestIds)
          },
          wallet: {
            coins: Number(wallet.coins || 0),
            totalEarned: Number(wallet.totalEarned || 0),
            totalWithdrawn: Number(wallet.totalWithdrawn || 0),
            completedQuestsCount: Number(wallet.completedQuestsCount || 0),
            streakDays: Number(wallet.streakDays || 1)
          },
          withdrawals: toArray(raw.withdrawals),
          shop: {
            cooldowns: (shop.cooldowns && typeof shop.cooldowns === 'object') ? shop.cooldowns : {},
            purchases: toArray(shop.purchases)
          }
        };
      }

      const DB = {
        mode: 'local', // 'firebase' | 'local'
        isOnline: true,
        fbDb: null,
        unsubscribeFn: null,
        bc: null,

        init() {
          const dbUrl = (FIREBASE_CONFIG.databaseURL || '').trim();
          const hasConfig = Boolean(dbUrl);
          if (hasConfig && typeof window.firebase !== 'undefined') {
            try {
              const cfg = { ...FIREBASE_CONFIG, databaseURL: dbUrl };
              if (!firebase.apps.length) firebase.initializeApp(cfg);
              this.fbDb = firebase.database();
              this.mode = 'firebase';

              // Отслеживание реального состояния подключения к серверу Firebase
              this.fbDb.ref('.info/connected').on('value', snap => {
                this.isOnline = Boolean(snap.val());
                updateConnectionBadge();
              });
            } catch (err) {
              console.warn('Firebase init fallback to local:', err);
              this.mode = 'local';
            }
          } else {
            this.mode = 'local';
          }

          if (this.mode === 'local' && typeof BroadcastChannel !== 'undefined') {
            this.bc = new BroadcastChannel('lovequest_sync_channel');
          }
        },

        localKey(pairCode) {
          return `lovequest_pair_room_${pairCode}`;
        },

        async getPair(pairCode) {
          if (this.mode === 'firebase') {
            try {
              const snap = await withTimeout(
                this.fbDb.ref(`pairs/${pairCode}`).once('value'),
                NETWORK_TIMEOUT_MS,
                { __timeout: true }
              );
              if (snap && snap.__timeout) return { __networkError: true };
              const val = snap ? snap.val() : null;
              return val ? normalizePairData(val, pairCode) : null;
            } catch (_) {
              return { __networkError: true };
            }
          }
          try {
            const raw = localStorage.getItem(this.localKey(pairCode));
            return raw ? normalizePairData(JSON.parse(raw), pairCode) : null;
          } catch (_) { return null; }
        },

        async setPair(pairCode, data) {
          const normalized = normalizePairData(data, pairCode);
          if (this.mode === 'firebase') {
            await this.fbDb.ref(`pairs/${pairCode}`).set(normalized);
            return normalized;
          }
          localStorage.setItem(this.localKey(pairCode), JSON.stringify(normalized));
          if (this.bc) this.bc.postMessage({ pairCode, data: normalized });
          return normalized;
        },

        async transact(pairCode, mutatorFn) {
          if (this.mode === 'firebase') {
            try {
              const ref = this.fbDb.ref(`pairs/${pairCode}`);
              const res = await ref.transaction(current => {
                if (current === null) return current;
                const copy = normalizePairData(JSON.parse(JSON.stringify(current)), pairCode);
                return mutatorFn(copy);
              });
              const val = res.snapshot ? res.snapshot.val() : null;
              return val ? normalizePairData(val, pairCode) : null;
            } catch (_) {
              showToast('Нет связи с сервером, попробуй ещё раз 🌐');
              return null;
            }
          }
          const current = await this.getPair(pairCode);
          if (!current || current.__networkError) return null;
          const updated = mutatorFn(normalizePairData(JSON.parse(JSON.stringify(current)), pairCode));
          if (updated) {
            await this.setPair(pairCode, updated);
          }
          return updated;
        },

        subscribe(pairCode, callback) {
          this.unsubscribe();
          if (this.mode === 'firebase') {
            const ref = this.fbDb.ref(`pairs/${pairCode}`);
            const handler = snap => {
              const val = snap.val();
              if (val) callback(normalizePairData(val, pairCode));
            };
            ref.on('value', handler);
            this.unsubscribeFn = () => ref.off('value', handler);
          } else {
            const onStorage = e => {
              if (e.key === this.localKey(pairCode) && e.newValue) {
                try { callback(normalizePairData(JSON.parse(e.newValue), pairCode)); } catch (_) {}
              }
            };
            const onBc = e => {
              if (e.data && e.data.pairCode === pairCode && e.data.data) {
                callback(normalizePairData(e.data.data, pairCode));
              }
            };
            window.addEventListener('storage', onStorage);
            if (this.bc) this.bc.addEventListener('message', onBc);
            this.unsubscribeFn = () => {
              window.removeEventListener('storage', onStorage);
              if (this.bc) this.bc.removeEventListener('message', onBc);
            };
            this.getPair(pairCode).then(d => { if (d && !d.__networkError) callback(d); });
          }
        },

        unsubscribe() {
          if (this.unsubscribeFn) {
            this.unsubscribeFn();
            this.unsubscribeFn = null;
          }
        }
      };

        if (DB.mode === 'firebase' && DB.fbDb && DB.isOnline) {

      async function connectToPair(pairCode, role, initialSnapshot = null) {
        State.session.pairCode = pairCode;
        State.session.role = role;

        await SessionStore.save({
          pairCode,
          role,
          userNickname: State.user.name,
          audioPrefs: AudioEngine.prefs
        });

        document.getElementById('onboarding-view').classList.remove('active');
        document.getElementById('main-view').classList.add('active');

        // Мгновенно показываем локальный кэш при повторном открытии (даже если сеть медленная)
        if (initialSnapshot && !State.pairData) {
          State.pairData = normalizePairData(initialSnapshot, pairCode);
          State.prevCompletedCount = State.pairData.wallet?.completedQuestsCount || 0;
          State.startedQuestIds = loadStartedQuests(State.pairData.daily?.cycleId);
          renderAll();
        }

        DB.subscribe(pairCode, async (data) => {
          const prevDone = State.prevCompletedCount;
          const newDone = data.wallet?.completedQuestsCount || 0;
          const isFirst = !State.pairData;

          State.pairData = data;
          State.prevCompletedCount = newDone;
          State.startedQuestIds = loadStartedQuests(data.daily?.cycleId);
          SessionStore.saveSnapshot(pairCode, data);

          if (!isFirst && State.session.role === 'girlfriend' && newDone > prevDone) {
            Haptic.notify('success');
            AudioEngine.sfx('coin');
            launchConfetti();
            showToast('Парень подтвердил задание! Монеты зачислены 🎉');
          }

          renderAll();
          await checkAndResetDailyCycle();
        });

        touchLastSeen();
      }

<!-- ... existing code ... -->
      /* ========================================================================
         15. BOOTSTRAP SEQUENCE
         ======================================================================== */
      async function bootstrap() {
        initTelegramSDK();
        detectUser();
        DB.init();
        wireEvents();

        const saved = await SessionStore.load();
        AudioEngine.init(saved.audioPrefs);

        if (saved.userNickname && !tg?.initDataUnsafe?.user) {
          State.user.name = saved.userNickname;
        }

        const splashText = document.getElementById('splash-status-text');
        if (saved.pairCode && saved.role) {
          splashText.textContent = `Подключение к паре ${saved.pairCode}…`;
          const cachedSnapshot = await SessionStore.loadSnapshot(saved.pairCode);

          // Подключаемся сразу (не разрывая пару при медленном или временно недоступном интернете)
          if (cachedSnapshot) {
            await connectToPair(saved.pairCode, saved.role, cachedSnapshot);
          } else {
            const remote = await DB.getPair(saved.pairCode);
            if (remote && !remote.__networkError) {
              await connectToPair(saved.pairCode, saved.role, remote);
            } else if (remote && remote.__networkError) {
              // Сеть временно недоступна — оставляем сопряжение и ждём восстановления
              await connectToPair(saved.pairCode, saved.role, createInitialPairData(saved.pairCode, saved.role, ''));
              showToast('Офлайн-режим: данные синхронизируются при появлении сети 📡');
            } else if (DB.mode === 'local') {
              const localRoom = createInitialPairData(saved.pairCode, saved.role, '');
              await DB.setPair(saved.pairCode, localRoom);
              await connectToPair(saved.pairCode, saved.role, localRoom);
            } else {
              // Комната действительно отсутствует на сервере
              await SessionStore.clearPair();
              openOnboarding();
            }
          }
        } else {
          splashText.textContent = 'Готово к запуску 💞';
          openOnboarding();
        }

        setTimeout(() => {
          document.getElementById('splash-screen').classList.add('hidden');
        }, 650);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
